<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Nexa Propiedades</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );

        }

        .login-container {

            width: 100%;

            max-width: 420px;

            padding: 20px;

        }

        .login-card {

            background: white;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 20px 50px rgba(
                    0,
                    0,
                    0,
                    0.30
                );

        }

        .logo {

            text-align: center;

            margin-bottom: 30px;

        }

        .logo-icon {

            width: 70px;

            height: 70px;

            margin: auto;

            border-radius: 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #0f172a;

            color: white;

            font-size: 32px;

            font-weight: bold;

        }

        .logo h1 {

            margin-top: 15px;

            font-size: 25px;

            color: #0f172a;

        }

        .logo p {

            margin-top: 6px;

            color: #64748b;

            font-size: 14px;

        }

        .form-group {

            margin-bottom: 20px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: bold;

            color: #334155;

        }

        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }

        input:focus {

            border-color: #0f172a;

            box-shadow:
                0 0 0 3px
                rgba(
                    15,
                    23,
                    42,
                    0.10
                );

        }

        .password-container {

            position: relative;

        }

        .password-container input {

            padding-right: 50px;

        }

        .toggle-password {

            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;

        }

        .login-button {

            width: 100%;

            border: none;

            border-radius: 9px;

            padding: 14px;

            background: #0f172a;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }

        .login-button:hover {

            background: #1e293b;

            transform: translateY(-1px);

        }

        .forgot {

            text-align: center;

            margin-top: 20px;

        }

        .forgot a {

            color: #334155;

            text-decoration: none;

            font-size: 14px;

        }

        .forgot a:hover {

            text-decoration: underline;

        }

        .footer {

            text-align: center;

            margin-top: 25px;

            font-size: 12px;

            color: #94a3b8;

        }

        .error {

            background: #fee2e2;

            color: #991b1b;

            border: 1px solid #fecaca;

            padding: 11px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;

        }
        .mensaje-error {
        display: none;
        margin-bottom: 15px;
        padding: 12px;
        border-radius: 8px;
        background: #ffe5e5;
        color: #b42318;
        border: 1px solid #f5b5b5;
        font-size: 14px;
        text-align: center;
}



    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                N
            </div>

            <h1>
                Nexa Propiedades
            </h1>

            <p>
                Panel de gestión
            </p>

        </div>

        <div id="mensaje-error" class="mensaje-error"></div>

        <!-- FORMULARIO -->

        <form
            method="POST"
            action="/login"
        >


            <div class="form-group">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="correo@nexa.com"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>


                <div class="password-container">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="mostrarPassword()"
                        aria-label="Mostrar contraseña"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-button"
            >
                🔐 Iniciar sesión
            </button>


        </form>


        <!-- RECUPERACIÓN -->

        <div class="forgot">

            <a href="/recuperar-password">
                ¿Olvidaste tu contraseña?
            </a>

        </div>


        <!-- FOOTER -->

        <div class="footer">

            Nexa Propiedades © 2026

        </div>


    </div>


</div>


<script>

function mostrarPassword() {

    const password =
        document.getElementById("password");

    const boton =
        document.querySelector(
            ".toggle-password"
        );


    if (
        password.type === "password"
    ) {

        password.type = "text";

        boton.textContent = "🙈";

    } else {

        password.type = "password";

        boton.textContent = "👁️";

    }

}

</script>

<script>
    const parametros = new URLSearchParams(window.location.search);
    const error = parametros.get("error");
    const mensaje = parametros.get("mensaje");

if (mensaje) {
    const elemento = document.getElementById("mensaje-error");

    elemento.textContent = mensaje;
    elemento.style.display = "block";

    elemento.style.background = "#e8f7ed";
    elemento.style.color = "#18794e";
    elemento.style.borderColor = "#a8dfbd";
}

    if (error) {
        const mensaje = document.getElementById("mensaje-error");

        mensaje.textContent = error;
        mensaje.style.display = "block";
    }
</script>
</body>

</html>
